random_seed: 42
dataset_version: febrl3_v1
split_strategy: deterministic_entity_split
train_ratio: 0.6
valid_ratio: 0.2
test_ratio: 0.2
blocking:
  febrl3:
    strategy: postcode
    field: postcode
  walmart_amazon:
    strategy: none
thresholds: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
matching_weights:
  name: 0.4
  email: 0.3
  phone: 0.3
evaluation:
  metrics: [precision, recall, f1, false_positive, false_negative]
  official_split: prefer
