services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  syncguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Local-validation values only. Production MUST set SECRET_KEY and
      # API_KEY from secrets (placeholder SECRET_KEY is refused at boot).
      ENV: "production"
      PORT: "8000"
      SECRET_KEY: "local-validation-only-not-a-secret"
      API_KEY: "local-validation-key"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncguard
      SYNCGUARD_PG_TARGET: postgresql://postgres:postgres@sg-sync-target:5432/syncguard_target
      DEMO_MODE: "true"
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    # NOTE: image CMD runs `alembic upgrade head` then uvicorn on $PORT.
    # redis/worker below are OPTIONAL local infrastructure only; the core
    # product runs inline and the backend does not depend on them.

  celery-worker:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEMO_MODE: "true"
    depends_on:
      redis:
        condition: service_healthy
      syncguard:
        condition: service_healthy
    command: ["celery", "-A", "backend.app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]

volumes:
  postgres_data:
  redis_data:
